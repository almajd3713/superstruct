[workspace]
resolver = "3"
members = ["crates/gen", "crates/engine", "crates/game", "tools/slice", "tools/bots"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Noisy for this codebase: x/y/z naming, i64<->f32 conversions are deliberate and reviewed.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
many_single_char_names = "allow"
cast_precision_loss = "allow"
unwrap_used = "warn"
expect_used = "warn"
