[package]
name = "game"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# CPU profiling zones for Tracy; see PLAN.md §11.4.
tracy = ["engine/tracy", "dep:tracy-client"]

[dependencies]
anyhow = "1.0.104"
engine = { version = "0.1.0", path = "../engine" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracy-client = { version = "0.19.0", optional = true }
