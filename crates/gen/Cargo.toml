[package]
name = "gen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `gen` is a reserved keyword in edition 2024, so the library is imported as `worldgen`.
[lib]
name = "worldgen"

[lints]
workspace = true

[features]
serde = ["dep:serde", "glam/serde"]

[dependencies]
glam = "0.34.1"
serde = { version = "1.0.229", features = ["derive"], optional = true }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.145"
