[package]
name = "engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytemuck = "1.25.2"
egui = { version = "0.37.0", features = ["default_fonts"] }
egui-wgpu = "0.37.0"
egui-winit = "0.37.0"
gen = { version = "0.1.0", path = "../gen" }
glam = "0.34.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify = "8.2.0"
pollster = "1.0.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"
tracing = "0.1.44"
tracy-client = { version = "0.19.0", optional = true }
wgpu = "30.0.1"
winit = "0.30.13"

[features]
tracy = ["dep:tracy-client"]
