[profile.default]
# A test that runs for minutes is a bug (a search loop that cannot finish): report it at 60 s
# and kill it at 300 s instead of hanging the whole run.
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

# The tram envelope test generates thousands of L2 cells; it needs its time on a busy machine.
[[profile.default.overrides]]
filter = 'test(no_l2_primitive_enters_the_envelope)'
slow-timeout = { period = "60s", terminate-after = 24 }
